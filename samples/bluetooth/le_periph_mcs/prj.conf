# Console over SEGGER RTT (no UART wiring on the DK).
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

CONFIG_LOG=y
CONFIG_ASSERT=y

# Use the Alif/RivieraWaves host stack instead of Zephyr's native host.
CONFIG_BT=y
CONFIG_BT_CUSTOM=y
CONFIG_BLE_DEVICE_NAME="ALIF_MCS"

# Default profile/env heaps are too small for MCS + included OTS with all
# Object ID characteristics: gatt_db_svc16_add() returns
# GAP_ERR_INSUFF_RESOURCES (75) when ke_malloc_user(KE_MEM_PROFILE) fails.
# Sizes match le_audio/unicast_acceptor.
CONFIG_ALIF_BLE_HOST_ADDL_PRF_HEAPSIZE=10240
CONFIG_ALIF_BLE_HOST_ADDL_ENV_HEAPSIZE=8192

# Persist bonding keys and CCCDs across resets (PTS reconnects between subtests).
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# Required by the Zephyr randomizer used during pairing.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
